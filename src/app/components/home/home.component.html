<section>
  <form>
    <input type="text" placeholder="Filter by city" />
    <button class="primary" type="button">Search</button>
  </form>
</section>

<p>Total Property Clicks: {{ clickCount() }}</p>

<section class="results">
  @for (housingLocation of housingService.getAllLocations(); track $index) {
    <app-housing-location 
      [location]="housingLocation" 
      (onLocationClick)="handleLocationClicked($event)" 
    />
  }
</section>
