<form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
  <label for="firstName">First Name:</label>
  <input id="firstName" formControlName="firstName" />
  <!-- //[formControl]="profileForm.controls.firstName" instead of formControlName also works -->

  <label for="lastName">Last Name:</label>
  <input id="lastName" formControlName="lastName" />
    <h3>ADDRESS</h3>
  <div formGroupName="address">
    <label for="street">Street:</label>
    <input id="street" formControlName="street" />

    <label for="city">City:</label>
    <input id="city" formControlName="city" />

    <label for="state">State:</label>
    <input id="state" formControlName="state" />
    <br>
    <label for="zip">Zip:</label>
    <input id="zip" formControlName="zip" />
  </div>
   <button  (click)="updateForm()">Update Form</button>
  <button type="submit" [disabled]="!profileForm.valid">Submit</button>
</form>
<br>
<label for="name">Name: </label>
<input id="name" type="text" [formControl]="name" (change)="handleChange()"/>

<p>Value: {{ name.value }}</p>


<button (click)="updateName()">Update Name</button>
